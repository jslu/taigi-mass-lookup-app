<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taigi Mass Lookup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="lib/unifi-tokens.css" />
<link rel="stylesheet" href="styles.css" />
<script>
  // Apply the persisted theme before first paint, so there's no flash of
  // the wrong theme while main.js loads and Elm mounts. "system" (or no
  // saved preference) leaves data-theme unset, letting the CSS
  // prefers-color-scheme media query decide.
  (function () {
    try {
      var raw = localStorage.getItem('taigi-mass-lookup:tweaks');
      var theme = raw && JSON.parse(raw).theme;
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (_) { /* ignore */ }
  })();
</script>
</head>
<body>
<div id="root"></div>

<script src="main.js"></script>
<script>
  var TWEAK_KEY = 'taigi-mass-lookup:tweaks';

  function readTweaks() {
    try {
      var raw = localStorage.getItem(TWEAK_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) {
      return null;
    }
  }

  var app = Elm.Main.init({
    node: document.getElementById('root'),
    flags: readTweaks()
  });

  app.ports.saveTweaks.subscribe(function (tweaks) {
    try {
      localStorage.setItem(TWEAK_KEY, JSON.stringify(tweaks));
    } catch (_) { /* ignore */ }
  });

  app.ports.copyToClipboard.subscribe(function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    }
  });

  app.ports.setThemeAttribute.subscribe(function (theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  });
</script>
</body>
</html>
